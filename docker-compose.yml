services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paisaan
      POSTGRES_USER: paisaan
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://paisaan:change-me@postgres:5432/paisaan
      REDIS_URL: redis://redis:6379/0
      API_CORS_ORIGINS: http://localhost:8501
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: .
    command: celery -A backend.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://paisaan:change-me@postgres:5432/paisaan
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]

volumes:
  postgres_data:
